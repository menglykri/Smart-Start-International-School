<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />

    <link rel="icon" href="assets/logo-square.png" />

      </section>
    </main>
    <section class="section">
      <div class="wrap cta">
        <div>
          <span class="eyebrow">
            Admissions open
          </span>

          </h2>

        <a class="btn" href="contact/#telegram-title" data-i18n="contact-now" data-i18n-suffix=" →">
          Contact Now →
        </a>
      </div>
